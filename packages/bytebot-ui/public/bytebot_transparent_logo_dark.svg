<svg width="2132" height="622" viewBox="0 0 2132 622" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- ===== Bot icon (dark, transparent) ===== -->
  <g stroke="#0D1117" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- EARS (drawn first so they sit behind the head) -->
    <!-- Left ear -->
    <g>
      <!-- outer ear puck -->
      <circle cx="141" cy="311" r="56" fill="#2F3B47"/>
      <circle cx="141" cy="311" r="56" fill="none" stroke="#0D1117" stroke-width="28"/>
      <!-- inner crescent -->
      <clipPath id="clipLeftEar">
        <circle cx="141" cy="311" r="56"/>
      </clipPath>
      <circle cx="155" cy="311" r="36" fill="#3A4653" clip-path="url(#clipLeftEar)"/>
    </g>

    <!-- Right ear -->
    <g>
      <circle cx="481" cy="311" r="56" fill="#2F3B47"/>
      <circle cx="481" cy="311" r="56" fill="none" stroke="#0D1117" stroke-width="28"/>
      <clipPath id="clipRightEar">
        <circle cx="481" cy="311" r="56"/>
      </clipPath>
      <circle cx="467" cy="311" r="36" fill="#3A4653" clip-path="url(#clipRightEar)"/>
    </g>

    <!-- HEAD + ANTENNA -->
    <line x1="311" y1="120" x2="311" y2="180" stroke="#0D1117"/>
    <circle cx="311" cy="90" r="28" fill="#0D1117"/>
    <circle cx="311" cy="311" r="170" fill="#21272cff" />
    <circle cx="311" cy="311" r="170" fill="none" stroke="#0D1117"/>

    <!-- FACE -->
    <circle cx="260" cy="300" r="22" fill="#0D1117"/>
    <circle cx="362" cy="300" r="22" fill="#0D1117"/>
    <path d="M250 360 Q311 420 372 360" fill="none" stroke="#0D1117"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="560" y="330" fill="#000000"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="300" font-weight="700"
        dominant-baseline="middle">mybote</text>
</svg>
